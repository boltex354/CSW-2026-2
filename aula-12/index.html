<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula-12</title>
    <style>

        .container-1 {
            display: flex;
            background-color: black;
            color: red;
        }

        .container-2 {
            display: flex;
            background-color: blueviolet;
            border: 2px solid;
            align-items: center;
            width: 100%;
            height: 50px;
            justify-content: center;
            border-radius: 20px;
        }
            .item-1 .item-2 .item-3 {
                flex-grow: 1;
            }
        .container-3 {
            display: flex;
            background-color: aquamarine;
            border-radius: 20px;
            border: 5px solid;
        }
            .item-4 .item-5 .item-7 .item-8 {
                flex-grow: 1;
            }
            .item-6 {
                flex-grow: 2;
            }
            
    </style>
</head>
<body>
    <div class="container-2">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Veritatis, non ad quam a debitis molestias quia, quae omnis officiis facere eius numquam, optio eum. Impedit et quam ullam neque aut.</div>

    
</body>
</html>
