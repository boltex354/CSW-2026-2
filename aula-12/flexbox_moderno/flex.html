<head>

    <title>Pagina 5</title>

    <style>

    body {
        text-align: center;
    }

    .container {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        background-color: rgb(0, 1, 53);
        justify-content: flex-start;
        gap: 16px;
        padding: 20px;
        border-radius: 20px;
        height: 5vh;
    }
    .container-5 {

        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        background-color:  rgb(0, 1, 53);
        justify-content: flex-end;
        gap: 16px;
        padding: 20px;
        border-radius: 20px;
        height: 5vh;
    }

    .container-6{
        display:flex;
        flex-direction: row;
        flex-wrap: wrap;
        background-color: rgb(0, 1, 53);
        justify-content: center;
        gap: 16px;
        padding: 20px;
        border-radius: 20px;
        height: 5vh;
    }
        .container-7{
        display:flex;
        flex-direction: row;
        flex-wrap: wrap;
        background-color: rgb(0, 1, 53);
        justify-content: space-between;
        gap: 16px;
        padding: 20px;
        border-radius: 20px;
        height: 5vh;
    }

    .container-8 {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        background-color:  rgb(0, 1, 53);
        justify-content: space-around;
        gap: 16px;
        padding: 20px;
        border-radius: 20px;
        height: 5vh;
    }

    .itemm {
        background-color: orangered;
        border-radius: 4px;
        flex: 0 0 70px;
    }
    .container-9 {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        background-color: rgb(0, 1, 53);
        align-items: flex-start;
        gap: 16px;
        padding: 100px;
        border-radius: 20px;

    }

    .item-rebelde-1 {
        background-color: orangered;
        border-radius: 10px;
        flex: 0 0 70px;
        height: 15vh;
        
    }

    .item-rebelde-2 {

    .item-rebelde-4 {
        background-color: orangered;
        border-radius: 10px;
        flex: 0 0 70px;
        height: 15vh;
        align-self: center;
        margin-top: 100px;
   
    }
    p {
        color: white;
        text-align: center;
        margin: 0 0 10px 0;
    }
